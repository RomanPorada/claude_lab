name: deploy
on:
  push:
    branches: [lab1]

permissions:
  id-token: write   # потрібно для OIDC
  contents: read

env:
  IMAGE: api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC, без ключів)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build & push (тег = хеш коміту)
        run: |
          IMG=${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE }}:${{ github.sha }}
          docker build -t $IMG .
          docker push $IMG

      - name: Update Container App
        run: |
          az extension add --name containerapp --upgrade --yes --only-show-errors
          az containerapp update \
            --name ${{ vars.CONTAINER_APP }} \
            --resource-group ${{ vars.RESOURCE_GROUP }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE }}:${{ github.sha }}

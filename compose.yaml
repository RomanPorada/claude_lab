services:
  db:
    image: postgres:16.4-bookworm
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: atoms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d atoms"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DB_HOST: db
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD:-app}
      DB_NAME: atoms
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
